<form [formGroup]="infoForm" class="row">
    <div class="col-lg-4 col-md-6 mb-3">
        <label for="first_name" class="form-label">{{'app.first' | translate}}</label>
        <input type="text" class="form-control" [placeholder]="'app.enter_your_first' | translate"
            formControlName="first_name">
    </div>
    <div class="col-lg-4 col-md-6 mb-3">
        <label for="last_name" class="form-label">{{'app.last' | translate}}</label>
        <input type="text" class="form-control" [placeholder]="'app.enter_your_last' | translate"
            formControlName="last_name">
    </div>
    <div class="col-lg-4 col-md-6 mb-3">
        <label for="date_of_birth" class="form-label">{{'app.date_of_birth' | translate}}</label>
        <input type="date" class="form-control" formControlName="date_of_birth">
    </div>
    <div class="col-md-6 mb-3">
        <label for="phone" class="form-label">{{'public.phone' | translate}}<sup class="text-danger">*</sup></label>
        <input type="tel" class="form-control" [placeholder]="'app.enter_your_phone' | translate"
            formControlName="phone">
    </div>
    <div class="col-md-6 mb-3">
        <label for="email" class="form-label">{{'app.email' | translate}}<sup class="text-danger">*</sup></label>
        <input type="email" class="form-control" [placeholder]="'app.enter_your_email' | translate"
            formControlName="email">
    </div>
    <div class="col-12 d-flex justify-content-between align-items-center">
        <button type="button" class="btn btn-sm btn-dark" (click)="getTabName('menu')">
            <i class="ri-arrow-left-line me-2"></i>{{'public.previous' |
            translate}}</button>

        <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-sm btn-danger" (click)="reset()"><i
                    class="ri-eraser-line me-2"></i>{{'public.clear'
                | translate}}</button>
            <button type="button" class="btn btn-sm btn-dark" [disabled]="infoForm.invalid" (click)="submitForm()"><i
                    class='ri-save-3-line me-2'></i>{{'public.save' | translate}}</button>
        </div>
    </div>
    <!-- <div class="col-lg-4 col-md-6 mb-3"></div> -->
</form>

<div id="verifyTwilioCode" class="modal fade" tabindex="-1" aria-labelledby="verifyTwilioCodeLabel"
    style="display: none;" data-bs-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="verifyTwilioCodeLabel">{{'public.verify_otp_code' | translate}}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" #closeVerifyModal
                    aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="text-muted text-center small">{{'public.code_sent_on_mobile' | translate}}</div>
                <div class="d-flex justify-content-center gap-2 my-3">
                    @for (otp of otp_array; track $index) {
                    <input #otpInput type="text" maxlength="1" class="form-control p-0 text-center otp-input"
                        inputmode="numeric" (input)="onInput($event, $index)" (keydown)="onKeyDown($event, $index)">
                    }
                </div>
                <button type="submit"
                    class="btn btn-dark d-flex justify-content-center align-items-center gap-2 w-100" (click)="verifyOTP()"><i
                        class="ri-shield-check-line"></i>{{'public.verify' | translate}}</button>
            </div>

        </div>
    </div>
</div>
