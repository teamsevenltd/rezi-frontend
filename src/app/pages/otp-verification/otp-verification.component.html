<div class="row authentication mx-0 vh-100">
  <div class="col-xxl-7 col-xl-7 col-lg-7 col-12 bg-white">
    <div class="row justify-content-center align-items-center h-100">
      <div class="col-md-7 col-lg-8 col-10 mx-auto">
        <div class="text-center">
          <img src="./assets/images/rezi24-public.png" class="company-logo" routerLink="/" alt="REZI24?">
        </div>
        <div class="mb-3">
          <h3 class="fw-bolder fs-24">
            {{ 'app.otp_verification_code_title' | translate }}
          </h3>
        </div>

        <p class="text-muted fs-13">
          {{ 'app.otp_verification_description' | translate }}
        </p>

        <form [formGroup]="otpForm" (ngSubmit)="onSubmit()">
          <div class="d-flex justify-content-center gap-2 mb-3">
            @for (otp of otp_array; track $index) {
            <input #otpInput type="text" maxlength="1" class="form-control p-0 text-center otp-input"
              inputmode="numeric" (input)="onInput($event, $index)" (keydown)="onKeyDown($event, $index)"
              (paste)="onPaste($event)">
            }
          </div>

          <button type="submit"
            class="btn mt-4 btn-dark w-100 d-flex align-items-center justify-content-center fw-medium fs-15"
            [disabled]="loading">
            <span *ngIf="!loading" class="d-flex align-items-center"><i
                class='ri-shield-keyhole-line fs-18 mx-2'></i>{{'app.verify_proceed' | translate}}</span>
            <span *ngIf="loading">
              <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-xxl-5 col-xl-5 col-lg-5 d-lg-block d-none px-0 bg-cover">
    <div class="text-center">
      <img src="./assets/images/two_factor.svg" class="min-vh-100 w-75" alt="REZI24">
    </div>
  </div>
</div>

<div class="dropdown">
  <button class="btn btn-dark dropdown-toggle public-dropdown" type="button" id="dropdownMenu" data-bs-toggle="dropdown"
    aria-expanded="false">
    <div class="d-flex align-items-center gap-2" (click)="switchLanguage(selectedLang)">
      <img [src]="'./assets/images/flags/' + (selectedLang === 'en' ? 'us' : 'germany') + '.svg'" class="rounded" alt=""
        style="height: 1rem; width: 1rem;">
      {{ selectedLang === 'en' ? 'English' : 'German' }}
    </div>
  </button>
  <div class="dropdown-menu" aria-labelledby="dropdownMenuButton1" role="button" style="min-width: auto !important;">
    <a class="dropdown-item" (click)="switchLanguage('de')">
      <div class="d-flex align-items-center gap-2">
        <img src="./assets/images/flags/germany.svg" class="rounded" alt="" style="height: 1rem; width: 1rem;">
        Deutsch
      </div>
    </a>
    <a class="dropdown-item" (click)="switchLanguage('en')">
      <div class="d-flex align-items-center gap-2">
        <img src="./assets/images/flags/us.svg" class="rounded" alt="" style="height: 1rem; width: 1rem;">
        English
      </div>
    </a>
  </div>
</div>
